  <div hidden aria-hidden="true">
    <template id="s1">
      <div class="truth-card"><span class="truth-label">Texto Áureo</span><div class="truth-text">“Não cessamos de orar por vós e de pedir que transbordeis de pleno conhecimento da sua vontade, em toda a sabedoria e entendimento espiritual.” <span class="ref">Colossenses 1.9</span></div></div>
      <div class="practical-card"><span class="truth-label">Verdade Prática</span><strong>A Bíblia interpreta a própria Bíblia.</strong></div>
      <h3>Devocional Diário</h3>
      <div class="devotional-grid">
        <div class="devotional-item"><strong>Segunda · Dt 8.3</strong>Alimento para a alma faminta</div>
        <div class="devotional-item"><strong>Terça · 2Tm 3.16</strong>Palavra inspirada por Deus</div>
        <div class="devotional-item"><strong>Quarta · Ez 37.7</strong>O poder que concede vida</div>
        <div class="devotional-item"><strong>Quinta · 2Co 6.7</strong>Armas ofensivas e defensivas</div>
        <div class="devotional-item"><strong>Sexta · Jr 15.16</strong>Sentir prazer nos Mandamentos</div>
        <div class="devotional-item"><strong>Sábado · Sl 119.11</strong>Guardar a Palavra no coração</div>
      </div>
      <p class="ref">Hinos da Harpa: 408 · 147 · 135</p>
    </template>
    <template id="s2">
      <h3>Colossenses 1.9–12</h3>
      <div class="verse-list">
        <div class="verse"><span class="verse-num">9</span><p>Por esta razão, também nós, desde o dia em que o ouvimos, não cessamos de orar por vós e de pedir que transbordeis de pleno conhecimento da sua vontade, em toda a sabedoria e entendimento espiritual;</p></div>
        <div class="verse"><span class="verse-num">10</span><p>a fim de viverdes de modo digno do Senhor, para o seu inteiro agrado, frutificando em toda boa obra e crescendo no pleno conhecimento de Deus;</p></div>
        <div class="verse"><span class="verse-num">11</span><p>sendo fortalecidos com todo o poder, segundo a força da sua glória, em toda a perseverança e longanimidade; com alegria,</p></div>
        <div class="verse"><span class="verse-num">12</span><p>dando graças ao Pai, que vos fez idôneos à parte que vos cabe da herança dos santos na luz.</p></div>
      </div>
    </template>
    <template id="s3">
      <h3>Introdução</h3>
      <p>Ao estudar as Escrituras, deve-se levar em conta que não se pode entender o texto sagrado do seu próprio modo, seguindo fórmulas particulares (2Pe 1.20). A hermenêutica é a ciência que trata das regras que visam à interpretação das passagens bíblicas, buscando elucidar o seu real sentido e, assim, possibilitar a sua aplicação correta.</p>
    </template>
    <template id="s3b">
      <div class="truth-card"><span class="truth-label">I. A regra das regras</span><div class="truth-text">“A Bíblia interpreta a Bíblia.”</div></div>
      <p>Normalmente, quando se trata de interpretar o texto de um documento importante, no qual se encontram pontos obscuros, deve-se esperar primariamente que este seja o seu próprio intérprete. Esgotada essa possibilidade, outras fontes poderão ser buscadas. Em relação à Bíblia, tal procedimento não somente é conveniente e possível, mas também absolutamente necessário e indispensável. Desta, derivam todas as outras regras.</p>
    </template>
    <template id="s4">
      <h3>1. A Bíblia interpreta a Bíblia</h3>
      <p>De fato, a Bíblia é indiscutivelmente a melhor intérprete de si mesma. Esta é a primeira e fundamental regra da correta interpretação bíblica. A Escritura é, indiscutivelmente, o seu melhor comentário e interpretação.</p>
      <div class="truth-card"><span class="truth-label">Ideia-chave</span><div class="truth-text">Quando uma passagem parecer difícil, procure outra parte da Bíblia que a esclareça.</div></div>
      <p class="ref">Atos 8.30–35 · 2 Pedro 1.20</p>
    </template>
    <template id="s5">
      <h3>2. Contexto amplo</h3>
      <p>Para se interpretar a Bíblia, deve-se enxergar toda ela, a partir do seu contexto imediato, ou seja, partindo de todas as palavras em volta do texto, e depois verificar todas as outras passagens de referência. O intérprete precisa estar familiarizado com a Escritura e manter uma aplicação concentrada.</p>
    </template>
    <template id="s5b">
      <p>Quanto mais familiarizado estiver, mais facilmente encontrará os versículos e passagens correlatas que esclarecem outras passagens, <em>“conferindo coisas espirituais com espirituais”</em> (1Co 2.13). Isso equivale a usar a Bíblia de tal modo que ela venha a ser sua própria intérprete.</p>
    </template>
    <template id="s6">
      <h3>3. Simplicidade e clareza</h3>
      <p>Sendo a Bíblia um livro divinamente inspirado, seu objetivo principal é fazer o homem <em>“sábio para a salvação pela fé em Cristo Jesus”</em> (2Tm 3.15,16). Por isso, é plausível que a mensagem bíblica tenha sido expressa com simplicidade e clareza, para ser suficientemente entendida.</p>
      <p>Todavia, como a Bíblia trata, no seu conjunto, de temas que abrangem o céu e a terra, o visível e o invisível, o material e o espiritual, o tempo e a eternidade, há passagens que só podem ser plenamente entendidas mediante um estudo cuidadoso e aplicado.</p>
      <h3>Quando uma passagem parece difícil</h3>
      <p>Procure outra parte da Bíblia que a esclareça (At 8.30–35; Is 53.7).</p>
      <ul><li>A Bíblia é absolutamente consistente e não pode contradizer-se, inclusive em questões de doutrina, moral, ética ou fatos históricos.</li><li>O ensino de passagens claras e múltiplas deve ter prioridade sobre um ensino aparente de passagens únicas e obscuras.</li></ul>
    </template>
    <template id="s7">
      <h3>4. Uma única verdade</h3>
      <p>Há um significado correto para cada texto da Bíblia, uma única verdade possível, ao contrário da teoria liberal de que a interpretação depende de cada intérprete (Jo 17.17).</p>
      <p>Na realidade, não existem múltiplas interpretações corretas de uma passagem bíblica, exceto no sentido de que existem, algumas vezes, vários aspectos do significado. Uma passagem pode ter variadas aplicações, mas só existe um único significado central.</p>
      <p>A correta interpretação levará diferentes pessoas, de diferentes lugares e idades, a chegarem às mesmas conclusões sobre esse significado central, não ao contrário. Jesus enviou o Espírito Santo para nos guiar no entendimento correto da mesma Palavra que Ele inspirou (Jo 14.26; 1Jo 2.27).</p>
      <p class="ref">“A Bíblia é sua principal intérprete.”</p>
    </template>
    <template id="s8">
      <h3>II. Vantagens desta regra</h3>
      <p>Sabendo que a Escritura deve ser explicada pela própria Escritura, algumas vantagens decorrem de se usar a Bíblia como intérprete de si mesma.</p>
    </template>
    <template id="s8b">
      <h3>1. Sentido verdadeiro das palavras</h3>
      <p>Tomando a comparação de preceitos com preceitos, de conceitos com conceitos, verificando atentamente as passagens correlatas expressas na Palavra, não só o intérprete adquire o verdadeiro sentido das palavras e textos determinados, mas também a certeza, quanto à fé e à moral, de todas as doutrinas bíblicas (Lc 24.27).</p>
    </template>
    <template id="s9">
      <h3>2. Totalidade da mensagem</h3>
      <p>A revelação bíblica foi dada progressivamente, de maneira que algumas passagens apenas refletem um ensino parcial duma verdade (Is 28.10; Hb 1.1).</p>
    </template>
    <template id="s9b">
      <p>Portanto, deve-se ter sempre em mente que não se pode considerar de toda bíblica uma doutrina antes de resumir e encerrar tudo quanto a Escritura diz a respeito da mesma. Tampouco um dever é de todo bíblico se não abrange e reúne todos os ensinos, prescrições e reservas que determinam a Bíblia em relação ao mesmo.</p>
    </template>
    <template id="s10">
      <h3>3. Importância desta regra</h3>
      <p>É de suma importância observar a regra das regras (a Bíblia é sua própria intérprete), evitando incorrer em erros e até atrair sobre si a maldição que a própria Escritura Sagrada pronuncia contra quem adulterar a Palavra de Deus (2Co 4.2; 2Pe 3.16).</p>
      <p>Além disso, quem busca interpretar a Bíblia sob a égide dessa regra fundamental terá mais possibilidade de descobrir o verdadeiro significado dos textos sagrados.</p>
      <p>Quer seja para aplicar a verdade divina na sua própria vida, ou para pregar e ensinar a outros, o intérprete tem o dever de tomar os ensinamentos bíblicos na sua integridade e verdade, com o firme compromisso de jamais torcê-los ou ajustá-los à sua particular percepção ou necessidade.</p>
      <div class="truth-card"><span class="truth-label">Exemplo da lição</span><p>Ao ser tentado no deserto, Jesus usou esta regra de interpretação da Escritura para refutar cada uma das investidas satânicas (Mt 4.1–11).</p><p><em>“Não se pronuncia sentença antes de haver ouvido as partes.”</em></p></div>
    </template>
    <template id="s11">
      <h3>III. Violações desta regra</h3>
      <p>Muitos, ao longo da história, ignorando ou violando esta regra simples e racional, têm buscado conferir aos seus funestos erros (heresias) o aparente apoio das Escrituras.</p>
    </template>
    <template id="s11b">
      <h3>1. Erros históricos</h3>
      <p>Os judeus encontraram aparente apoio nas Escrituras para rejeitarem a Cristo, ao se fixarem em passagens bíblicas isoladas e arrancadas de seu contexto (Jo 1.11; 7.27; 12.34). Eles também rejeitaram o Seu testemunho (Jo 3.32; 5.43).</p>
    </template>

      <p>Todas as heresias têm pelo menos dois pontos em comum:</p>
      <ol type="a"><li>partir do pressuposto errôneo de que se pode provar qualquer coisa com a Bíblia;</li><li>ignorar a regra fundamental (e as demais regras) de interpretação.</li></ol>
      <p>Porém, o maior erro é desconhecer que <em>“a lei do Senhor é perfeita”</em>, portanto, não tem contradição nem falsidade (Sl 19.7).</p>

      <p>Tais pessoas estão sujeitas a juízo, pois estão em franca desobediência ao Espírito Santo, o Inspirador das Escrituras. Os mesmos foram enganados por Satanás, o primeiro intérprete conhecido da Palavra de Deus, o qual deu um sentido que ela não tinha, falseando astutamente a verdade (Gn 3.1–6; Ap 22.18). Cuidado!</p>

    <template id="s23">
      <h3>3. Simplicidade e clareza</h3>
      <p>Sendo a Bíblia um livro divinamente inspirado, seu objetivo principal é fazer o homem <em>“sábio para a salvação pela fé em Cristo Jesus”</em> (2Tm 3.15,16).</p>
      <p>Por isso, é plausível que a mensagem bíblica tenha sido expressa com simplicidade e clareza, para ser suficientemente entendida.</p>
    </template>
    <template id="s24">
      <h3>Quando uma passagem parece difícil</h3>
      <p>Todavia, como a Bíblia trata, no seu conjunto, de temas que abrangem o céu e a terra, o visível e o invisível, o material e o espiritual, o tempo e a eternidade, há passagens que só podem ser plenamente entendidas mediante um estudo cuidadoso e aplicado.</p>
      <p>Quando uma passagem da Bíblia parece difícil, deve-se procurar alguma outra parte da mesma que a esclareça (At 8.30–35; Is 53.7). Deve-se levar em conta o seguinte:</p>
    </template>
    <template id="s24b">
      <ol type="a"><li>A Bíblia é absolutamente consistente e não pode contradizer-se, inclusive em questões de doutrina, moral, ética ou fatos históricos.</li><li>O ensino de passagens claras e múltiplas deve ter prioridade sobre um ensino aparente de passagens únicas e obscuras.</li></ol>
    </template>
    <template id="s25">
      <h3>4. Uma única verdade</h3>
      <p>Há um significado correto para cada texto da Bíblia, uma única verdade possível, ao contrário da teoria liberal de que a interpretação depende de cada intérprete (Jo 17.17).</p>
      <p>Na realidade, não existem múltiplas interpretações corretas de uma passagem bíblica, exceto no sentido de que existem, algumas vezes, vários aspectos do significado.</p>
    </template>
    <template id="s26">
      <h3>Uma verdade central</h3>
      <p>Uma passagem pode ter variadas aplicações, mas só existe um único significado central. A correta interpretação levará diferentes pessoas, de diferentes lugares e idades, a chegarem às mesmas conclusões sobre esse significado central, não ao contrário.</p>
      <p>Jesus enviou o Espírito Santo para nos guiar no entendimento correto da mesma Palavra que Ele inspirou (Jo 14.26; 1Jo 2.27).</p>
      <p class="ref">“A Bíblia é sua principal intérprete.”</p>
    </template>
    <template id="s28">
      <h3>3. Importância desta regra</h3>
      <p>É de suma importância observar a regra das regras (a Bíblia é sua própria intérprete), evitando incorrer em erros e até atrair sobre si a maldição que a própria Escritura Sagrada pronuncia contra quem adulterar a Palavra de Deus (2Co 4.2; 2Pe 3.16).</p>
      <p>Além disso, quem busca interpretar a Bíblia sob a égide dessa regra fundamental terá mais possibilidade de descobrir o verdadeiro significado dos textos sagrados.</p>
    </template>

      <h3>Fidelidade ao texto</h3>

  <script>
    const slides = [
      {title:'Lição 3 · A Regra Fundamental',section:'Apresentação',template:'s19'},
      {title:'Devocional Diário',section:'Apresentação',template:'s20'},
      {title:'Leitura Bíblica · Colossenses 1.9–10',section:'Apresentação',template:'s21'},
      {title:'Leitura Bíblica · Colossenses 1.11–12',section:'Apresentação',template:'s22'},
      {title:'Introdução',section:'Regras',template:'s3'},
      {title:'A regra das regras',section:'Regras',template:'s3b'},
      {title:'A Bíblia interpreta a Bíblia',section:'Regras',template:'s4'},
      {title:'Contexto amplo',section:'Regras',template:'s5'},
      {title:'Passagens correlatas',section:'Regras',template:'s5b'},
      {title:'Simplicidade e clareza',section:'Regras',template:'s23'},
      {title:'Como interpretar passagens difíceis',section:'Regras',template:'s24'},
      {title:'Dois critérios de interpretação',section:'Regras',template:'s24b'},
      {title:'Uma única verdade',section:'Regras',template:'s25'},
      {title:'Uma verdade central',section:'Regras',template:'s26'},
      {title:'Vantagens desta regra',section:'Vantagens',template:'s8'},
      {title:'Sentido verdadeiro das palavras',section:'Vantagens',template:'s8b'},
      {title:'Totalidade da mensagem',section:'Vantagens',template:'s9'},
      {title:'A doutrina e o conjunto das Escrituras',section:'Vantagens',template:'s9b'},
      {title:'Importância desta regra',section:'Vantagens',template:'s28'},
      {title:'Fidelidade ao texto',section:'Vantagens',template:'s29'},
      {title:'O exemplo de Jesus',section:'Vantagens',template:'s29b'},
      {title:'Violações desta regra',section:'Violações',template:'s11'},
      {title:'Erros históricos',section:'Violações',template:'s11b'},
      {title:'Erros históricos · continuação',section:'Violações',template:'s30'},
      {title:'Dois pontos em comum',section:'Violações',template:'s31'},
      {title:'Juízos eternos',section:'Violações',template:'s32'},
      {title:'O primeiro intérprete',section:'Violações',template:'s33'},
      {title:'Quadro da lição',section:'Violações',template:'s33b'},
      {title:'Aplicação pessoal',section:'Aplicação',template:'s34'},
      {title:'Pergunta 1 · Regra fundamental',section:'Perguntas',quizIndex:0},
      {title:'Pergunta 2 · Interpretação',section:'Perguntas',quizIndex:1},
      {title:'Vocabulário',section:'Material de apoio',template:'s17'},
      {title:'Ferramentas à sua disposição',section:'Material de apoio',template:'s18'},
      {title:'Central de atendimento',section:'Material de apoio',template:'s18b'}
    ];
    const quizQuestions = [
      {question:'Qual é a regra fundamental da hermenêutica?',options:['A Bíblia interpreta a Bíblia.','Cada pessoa define o sentido que preferir.','Uma passagem deve ser lida isoladamente.','Fontes externas têm prioridade sobre o texto.'],answer:0,explanation:'A regra apresentada na lição é “A Bíblia interpreta a Bíblia”. Dela derivam as outras regras de interpretação.'},
      {question:'Quem foi o primeiro intérprete que deturpou a Palavra de Deus?',options:['Moisés, ao receber a Lei.','Satanás, ao distorcer a ordem de Deus.','Pedro, ao negar Jesus.','Paulo, ao interpretar os profetas.'],answer:1,explanation:'A lição relaciona essa resposta a Gênesis 3.1–6, quando a serpente dá outro sentido à ordem de Deus.'}
    ];
    let current = 0;
    const quizAnswers = [null,null];
    const stage = document.getElementById('slideStage');
    const sectionLabel = document.getElementById('sectionLabel');
    const counter = document.getElementById('counter');
    const progressFill = document.getElementById('progressFill');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const dotWrap = document.getElementById('slideDots');
    const topicNav = document.getElementById('topicNav');
    const presentation = document.getElementById('presentation');
    const presentButton = document.getElementById('presentButton');
    const letters = ['A','B','C','D'];

    function isPresenting() {
      return document.fullscreenElement === presentation || presentation.classList.contains('presentation-mode');
    }

    function fitSlide() {
      if(!isPresenting()) return;
      const frame = stage.querySelector('.slide-frame');
      if(!frame || !stage.clientHeight) return;
      const padding = getComputedStyle(stage);
      const available = stage.clientHeight - parseFloat(padding.paddingTop) - parseFloat(padding.paddingBottom);
      const minimum = stage.clientWidth >= 900 ? 24 : 16;
      let lower = minimum;
      let upper = Math.floor(Math.min(frame.clientWidth / 23, available / 6, 66));
      let size = minimum;
      while(lower <= upper) {
        const candidate = Math.floor((lower + upper) / 2);
        frame.style.setProperty('--slide-size', candidate + 'px');
        if(frame.offsetHeight <= available) {
          size = candidate;
          lower = candidate + 1;
        } else {
          upper = candidate - 1;
        }
      }
      frame.style.setProperty('--slide-size', size + 'px');
    }

    function syncPresentationButton() {
      const active = isPresenting();
      presentButton.setAttribute('aria-pressed', String(active));
      presentButton.title = active ? 'Sair do modo Datashow (F ou Esc)' : 'Modo Datashow (F)';
      presentButton.innerHTML = active
        ? '<i class="fa-solid fa-compress" aria-hidden="true"></i><span>Sair do Datashow</span>'
        : '<i class="fa-solid fa-expand" aria-hidden="true"></i><span>Datashow</span>';
      fitSlide();
    }

    async function openFullscreen() {
      if(!document.fullscreenEnabled || !presentation.requestFullscreen) return;
      try { await presentation.requestFullscreen(); }
      catch { /* O modo em janela já está ativo. */ }
    }

    async function togglePresentation() {
      if(isPresenting()) {
        presentation.classList.remove('presentation-mode');
        if(document.fullscreenElement === presentation) await document.exitFullscreen();
      } else {
        presentation.classList.add('presentation-mode');
        syncPresentationButton();
        await openFullscreen();
      }
      syncPresentationButton();
    }

    function renderQuiz(slide, questionNumber) {
      const q = quizQuestions[questionNumber];
      const selected = quizAnswers[questionNumber];
      const answered = selected !== null;
      const right = selected === q.answer;
      let options = '';
      q.options.forEach((option,index) => {
        const state = answered && index === q.answer ? ' correct' : (answered && index === selected ? ' incorrect' : '');
        options += '<button type="button" class="quiz-option' + state + '" data-option="' + index + '" ' + (answered ? 'disabled' : '') + '><span class="option-letter">' + letters[index] + '</span><span>' + option + '</span></button>';
      });
      const feedback = answered
        ? '<div class="feedback show" role="status"><strong>' + (right ? 'Muito bem!' : 'Vamos rever essa ideia.') + '</strong>' + (right ? '' : 'Resposta correta: ' + q.options[q.answer] + ' ') + q.explanation + (questionNumber === 1 ? '<button class="restart-quiz" type="button">Refazer as perguntas</button>' : '') + '</div>'
        : '';
      return '<div class="quiz-meta"><span>Quiz de revisão</span><span>Pergunta ' + (questionNumber + 1) + ' de ' + quizQuestions.length + (answered ? ' · Pontos ' + quizAnswers.filter((a,i) => a === quizQuestions[i].answer).length + '/2' : '') + '</span></div><h3 class="quiz-question">' + q.question + '</h3><div class="quiz-options">' + options + '</div>' + feedback;
    }

    function render() {
      const slide = slides[current];
      sectionLabel.textContent = slide.section;
      counter.textContent = 'Tela ' + (current + 1) + ' de ' + slides.length;
      progressFill.style.width = ((current + 1) / slides.length * 100) + '%';
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1 || (slide.quizIndex !== undefined && quizAnswers[slide.quizIndex] === null);
      next.innerHTML = current === slides.length - 1
        ? 'Fim do estudo <i class="fa-solid fa-check" aria-hidden="true"></i>'
        : slide.quizIndex !== undefined && quizAnswers[slide.quizIndex] === null
          ? 'Responda para continuar'
          : 'Próximo <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>';
      stage.innerHTML = '<div class="slide-frame"><h2 class="slide-title">' + slide.title + '</h2><div class="slide-content">' + (slide.template ? document.getElementById(slide.template).innerHTML : renderQuiz(slide,slide.quizIndex)) + '</div></div>';
      const subtitle = stage.querySelector('.slide-content > h3:first-child');
      if(subtitle && subtitle.textContent.replace(/^\d+\.\s*/, '') === slide.title) subtitle.hidden = true;
      fitSlide();
      stage.classList.remove('reveal');
      stage.scrollTop = 0;
      requestAnimationFrame(() => stage.classList.add('reveal'));
      stage.querySelectorAll('.quiz-option').forEach(button => button.addEventListener('click', () => {
        quizAnswers[slide.quizIndex] = Number(button.dataset.option);
        render();
      }));
      const restart = stage.querySelector('.restart-quiz');
      if(restart) restart.addEventListener('click',() => { quizAnswers.fill(null); current = slides.findIndex(item => item.quizIndex === 0); render(); });
      dotWrap.querySelectorAll('button').forEach((button,index) => button.setAttribute('aria-current',String(index === current)));
      topicNav.querySelectorAll('button').forEach(button => button.setAttribute('aria-current',String(button.dataset.section === slide.section)));
      topicNav.querySelectorAll('button').forEach(button => button.setAttribute('aria-label',button.dataset.section + (button.dataset.section === slide.section ? ' · seção atual' : '')));
    }

    const sections = [];
    slides.forEach((slide,index) => { if(!sections.includes(slide.section)) sections.push(slide.section); });
    sections.forEach(section => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'topic-btn';
      button.textContent = section;
      button.dataset.section = section;
      button.addEventListener('click',() => { current = slides.findIndex(slide => slide.section === section); render(); window.scrollTo({top:0,behavior:'smooth'}); });
      topicNav.appendChild(button);
    });
    slides.forEach((slide,index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'slide-dot';
      button.title = (index + 1) + '. ' + slide.title;
      button.setAttribute('aria-label','Ir para tela ' + (index + 1) + ': ' + slide.title);
      button.setAttribute('aria-current','false');
      button.addEventListener('click',() => { current = index; render(); window.scrollTo({top:0,behavior:'smooth'}); });
      dotWrap.appendChild(button);
    });
    previous.addEventListener('click',() => { if(current > 0){ current--; render(); window.scrollTo({top:0,behavior:'smooth'}); } });
    next.addEventListener('click',() => { if(current < slides.length - 1 && !next.disabled){ current++; render(); window.scrollTo({top:0,behavior:'smooth'}); } });
    presentButton.addEventListener('click',togglePresentation);
    document.getElementById('studyFullscreen').addEventListener('click', openFullscreen);
    let wasFullscreen = false;
    document.addEventListener('fullscreenchange', () => {
      const fullscreen = document.fullscreenElement === presentation;
      if(wasFullscreen && !fullscreen) presentation.classList.remove('presentation-mode');
      wasFullscreen = fullscreen;
      syncPresentationButton();
    });
    new ResizeObserver(fitSlide).observe(stage);
    document.fonts?.ready.then(fitSlide);
    document.addEventListener('keydown',event => {
      if(event.altKey || event.ctrlKey || event.metaKey) return;
      if(event.key === 'Escape' && document.fullscreenElement !== presentation && presentation.classList.contains('presentation-mode')){
        togglePresentation();
        return;
      }
      if(event.key.toLowerCase() === 'f'){ event.preventDefault(); togglePresentation(); return; }
      if(event.key === 'ArrowRight' && !next.disabled && current < slides.length - 1){ current++; render(); }
      if(event.key === 'ArrowLeft' && current > 0){ current--; render(); }
    });
    if(new URLSearchParams(location.search).get('datashow') === '1') {
      presentation.classList.add('presentation-mode');
    }
    if(!document.fullscreenEnabled) document.getElementById('studyFullscreen').style.display = 'none';
    render();
    syncPresentationButton();
  </script>
